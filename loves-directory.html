<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Route Stride Love's Directory</title><style>body{font:16px system-ui;margin:24px auto;max-width:850px;padding:0 14px;background:#0b1524;color:white}input{padding:12px;width:90%}li{padding:12px;border-bottom:1px solid #445}a{color:lightblue}@media print{body{color:black;background:white}input{display:none}}</style></head><body><a href="/planner.html">Back to planner</a><h1>Love's Truck Stop Directory</h1><p>Source addresses. Truck entrances and current operation require verification before driving.</p><input id="q" placeholder="Search name, address, city or state"><p id="count">Loading...</p><ul id="list"></ul><script>
let stops=[];const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count');
function draw(){const s=q.value.toLowerCase(),found=stops.filter(x=>(x.name+' '+x.address).toLowerCase().includes(s));count.textContent=found.length+' of '+stops.length+' locations';list.replaceChildren(...found.map(x=>{const li=document.createElement('li');li.textContent=x.name+' — '+x.address+' — ';const a=document.createElement('a');a.href='/planner.html?selectedStop='+encodeURIComponent(x.address)+'&selectedBrand='+encodeURIComponent(x.brand);a.textContent='Use as first break in trip plan';li.append(a);return li}))}
q.oninput=draw;fetch('/api/loves-directory').then(r=>r.json()).then(d=>{stops=d.stops||[];draw()}).catch(()=>count.textContent='Could not load directory');
</script></body></html>
