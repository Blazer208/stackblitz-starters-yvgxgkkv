<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Route Stride Pilot / Flying J Directory</title><style>body{font:16px system-ui;margin:24px auto;max-width:800px;padding:0 14px;background:#0b1524;color:white}input{padding:12px;width:90%}li{padding:10px;border-bottom:1px solid #445;line-height:1.5}a{color:lightblue}.note{color:#c5d1e3}@media print{body{color:black;background:white}input{display:none}}</style></head><body><a href="/planner.html">Back to planner</a><h1>Pilot / Flying J Directory</h1><p class="note">Includes map-area locations with store names and official addresses, plus the existing address book. Locations are candidates: Route Stride checks the truck route and stop window during planning. Verify the truck entrance before arrival.</p><input id="q" placeholder="Search store, city, state, or address"><p id="count">Loading...</p><ul id="list"></ul><script>
let stops=[];const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count');
function draw(){const s=q.value.toLowerCase(),found=stops.filter(x=>[x.name,x.brand,x.city,x.state,x.address].filter(Boolean).join(' ').toLowerCase().includes(s));count.textContent=found.length+' of '+stops.length+' locations';list.replaceChildren(...found.map(x=>{const li=document.createElement('li');li.append(document.createTextNode((x.name||x.brand||'Pilot / Flying J')+' — '+x.address+' — '));const a=document.createElement('a'),params=new URLSearchParams({pilotStop:x.address,selectedBrand:x.brand||'Pilot',selectedStopName:x.name||x.brand||'Pilot / Flying J location'});a.href='/planner.html?'+params.toString();a.textContent='Check as a first-break candidate';li.append(a);return li}))}
q.oninput=draw;fetch('/api/pilot-flyingj-directory').then(r=>r.json()).then(d=>{stops=d.stops||[];draw()}).catch(()=>count.textContent='Could not load locations');
</script></body></html>
