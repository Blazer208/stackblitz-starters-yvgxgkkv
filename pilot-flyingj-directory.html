<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Route Stride Pilot Flying J Addresses</title><style>body{font:16px system-ui;margin:24px auto;max-width:800px;padding:0 14px;background:#0b1524;color:white}input{padding:12px;width:90%}li{padding:10px;border-bottom:1px solid #445}a{color:lightblue}@media print{body{color:black;background:white}input{display:none}}</style></head><body><a href="/planner.html">Back to planner</a><h1>Pilot / Flying J Address Book</h1><p>305 listings from 39 states. Addresses are not GPS verified or approved truck entrances.</p><input id="q" placeholder="Search addresses"><p id="count">Loading...</p><ul id="list"></ul><script>
let stops=[];const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count');
function draw(){const s=q.value.toLowerCase(),found=stops.filter(x=>x.address.toLowerCase().includes(s));count.textContent=found.length+' of '+stops.length+' locations';list.replaceChildren(...found.map(x=>{const li=document.createElement('li');li.textContent=x.address;return li}))}
q.oninput=draw;fetch('/api/pilot-flyingj-directory').then(r=>r.json()).then(d=>{stops=d.stops||[];draw()}).catch(()=>count.textContent='Could not load addresses');
</script></body></html>
