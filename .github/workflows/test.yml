name: Route Stride Automated Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check index.js
          node --check auth.js
          node --check automatic-stop-engine.js
          node --check stop-directory.js
          node --check stop-policy.js
      - name: Automated regression tests
        run: npm test
